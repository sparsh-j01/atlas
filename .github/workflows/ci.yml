name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this job only checks out and builds — it needs read, nothing more.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned, not @v4: a tag can be repointed at any commit by whoever controls the
      # action repo, and this job runs before any human reads the diff. Comment carries the
      # version so Dependabot can still bump it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # don't leave GITHUB_TOKEN in .git/config
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # `npm ci` installs the locked tree exactly; `npm install` resolves the semver ranges in
      # package.json instead, so a malicious patch release of any transitive dep would run its
      # install scripts here and still report green against an unchanged lockfile.
      #
      # This was `npm install` because esbuild's optional platform deps tripped EBADPLATFORM.
      # That cause is gone: the lockfile now records all 26 @esbuild/* platform packages
      # (linux-x64 included) and npm >= 10.4 — which node 22 ships — resolves them correctly.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      # The whole suite, including the PR-safe half of the M7 evaluation layer. Everything
      # here is deterministic and needs no API key and no database: corpus and golden-set
      # invariants, source-coordinate grading, retrieval metric maths, the generation
      # metric classifier, prompt-injection detection, tenant-isolation scoping, reliability
      # scoring and the regression checker.
      #
      # Deliberately NOT here, because they cost real model calls and are run manually or on
      # a schedule (master doc section 15):
      #   npm run eval:benchmark    three-arm retrieval, needs embeddings + a seeded DB
      #   npm run eval:generation   judge-backed generation quality
      #   npm run eval:injection    end-to-end prompt injection
      #   npm run eval:reliability  repeated runs
      #   npm run eval:baseline     baseline vs RAG
      #   npm run eval:isolation    tenant isolation, Path A (needs a seeded DB)
      - run: npm test
