name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this job only checks out and builds — it needs read, nothing more.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # don't leave GITHUB_TOKEN in .git/config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install  # not npm ci: esbuild optional platform deps trip npm ci EBADPLATFORM
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      # The whole suite, including the PR-safe half of the M7 evaluation layer. Everything
      # here is deterministic and needs no API key and no database: corpus and golden-set
      # invariants, source-coordinate grading, retrieval metric maths, the generation
      # metric classifier, prompt-injection detection, tenant-isolation scoping, reliability
      # scoring and the regression checker.
      #
      # Deliberately NOT here, because they cost real model calls and are run manually or on
      # a schedule (master doc section 15):
      #   npm run eval:benchmark    three-arm retrieval, needs embeddings + a seeded DB
      #   npm run eval:generation   judge-backed generation quality
      #   npm run eval:injection    end-to-end prompt injection
      #   npm run eval:reliability  repeated runs
      #   npm run eval:baseline     baseline vs RAG
      #   npm run eval:isolation    tenant isolation, Path A (needs a seeded DB)
      - run: npm test
